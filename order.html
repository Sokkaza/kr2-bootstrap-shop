<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бронирование | Бильярдный клуб «Кий»</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Бильярдный клуб «Кий»</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">Услуги</a></li>
          <li class="nav-item"><a class="nav-link active" href="order.html">Бронирование</a></li>
          <li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0">Забронировать стол</h1>
          </div>
          <div class="card-body">
            <form>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Имя *</label>
                  <input type="text" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Телефон *</label>
                  <div class="input-group">
                    <span class="input-group-text">+7</span>
                    <input type="tel" class="form-control" placeholder="900 000-00-00" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Вид игры</label>
                  <select class="form-select">
                    <option selected>Выберите стол</option>
                    <option>Русский бильярд</option>
                    <option>Пул</option>
                    <option>Снукер</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Дата и время</label>
                  <input type="datetime-local" class="form-control">
                </div>
                <div class="col-12">
                  <div class="form-check mt-3">
                    <input class="form-check-input" type="checkbox" id="agree" required>
                    <label class="form-check-label" for="agree">Согласен на обработку данных *</label>
                  </div>
                </div>
                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-primary">Отправить заявку</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <p class="mb-0">&copy; 2026 Бильярдный клуб «Кий». Все права защищены.</p>
  </footer>

  <a href="#" class="btn btn-primary rounded-circle shadow" style="position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 20px; z-index: 1000;">↑</a>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
